aid: chipagents
name: ChipAgents
description: >-
  ChipAgents is the Agentic AI Chip Design Environment, helping semiconductor
  engineers iterate on chip design and verification up to 10x faster by
  collaborating with AI agents inside their favorite code editor. The platform
  spans design and verification workflows, coverage analysis, and Root Cause
  Analysis (RCA), surfaced through a project dashboard and the ChipAgents CLI,
  and is powered by the company's first model, Renoir. ChipAgents is delivered
  as a managed, authenticated web application (agent.chipagents.ai) rather than
  a public API; the company holds a SOC 2 Type II attestation and is backed by
  Micron, Samsung, MediaTek, and Bessemer Venture Partners, with a team drawn
  from Cadence, Synopsys, and Mentor Graphics.
